name: UI UX Redesign Verification

on:
  push:
    branches: [uiux-redesign-work]
  pull_request:
    branches: [uiux-redesign]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UI redesign contract
        run: npx vitest run test/ui-redesign-contract.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Existing unit suite (known non-UI baseline failures remain visible)
        continue-on-error: true
        run: npm run test:unit
      - name: Install Chromium for rendered UI smoke
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render desktop and mobile screenshots
        run: |
          mkdir -p ui-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/forge-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 >/dev/null
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --full-page --wait-for-timeout=1200 http://127.0.0.1:4173 ui-artifacts/research-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --full-page --wait-for-timeout=1200 http://127.0.0.1:4173 ui-artifacts/research-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: forge-uiux-render
          path: ui-artifacts/*.png
          if-no-files-found: error
